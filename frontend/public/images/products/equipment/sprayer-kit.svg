<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="32" fill="#F8FAF8"/>
  <ellipse cx="200" cy="355" rx="100" ry="14" fill="#000000" fillOpacity="0.08"/>
