  <text x="200" y="222" text-anchor="middle" fill="#1E293B" font-family="sans-serif" font-size="11" font-weight="800">16L BATTERY SPRAYER</text>
  <text x="200" y="238" text-anchor="middle" fill="#0284C7" font-family="sans-serif" font-size="9" font-weight="700">HEAVY DUTY PUMP</text>
